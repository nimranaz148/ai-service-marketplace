version: "3.8"

services:
  # -------------------------------------------------------------
  # 1. Redis Queue for Celery & Reminders
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ai_marketplace_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # -------------------------------------------------------------
  # 2. FastAPI Backend & Agent Runtime
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_marketplace_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - DEBUG=True
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    restart: unless-stopped

  # -------------------------------------------------------------
  # 3. Next.js + shadcn/ui Admin Web Dashboard
  # -------------------------------------------------------------
  admin-web:
    build:
      context: ./admin-web
      dockerfile: Dockerfile
    container_name: ai_marketplace_admin
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
